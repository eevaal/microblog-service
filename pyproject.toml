[project]
name = "microblog-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruslan", email = "realnoates@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
microblog-service = "microblog_service:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
